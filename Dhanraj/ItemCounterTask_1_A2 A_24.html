<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<title>JavaScript Task</title>

<style>
h1 {font-family:"Times New Roman", Times, serif; font-size:48px; font-style:italic; color:#ff0000; text-align:center}
h2 {font-family:Arial, Helvetica, sans-serif; font-size:14px; color:#000000; text-align:left}
h3 {font-family:Arial, Helvetica, sans-serif; font-size:24px; color:#FF0000}
</style>

</head>

<body>
    
    <script>
	var count = 0 // This will initiate the count variable to zero
	Count_Items()  {
	
	
	if (count ++ == 1); 
	document.getElementById("display count here").innerHTML = count + "Item Inspected"; // this will show the output when 1 item is outputed
	else;
	document.getElementById("display count here").innerHTML = count + "Items Inspected"; // this will show the output when more then 1 item is outputed
	}
	</script>

<div style="text-align:center">
   <h1>Tawara Information Solutions (UK)<br>(Trial) Item counter <br></h1>
   <h3>Please click for each item inspected </h3>

<br>
<br>
<br>
<button onClick="Count_Items()">Inspection Complete</button>
<br>
<h1 id="display Count here"></h1>
<br>
<br>
<br>
<input type="button" value="Reset Counter" onClick="document.location.reload(true)">
</div>


</body>
</html>
