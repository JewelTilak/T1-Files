<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JavaScript Task</title>
    <style>
        h1 {font-family:"Times New Roman", Times, serif; font-size:48px; font-style:italic; color:#ff0000; text-align:center}
        h2 {font-family:Arial, Helvetica, sans-serif; font-size:14px; color:#000000; text-align:left}
        h3 {font-family:Arial, Helvetica, sans-serif; font-size:24px; color:#FF0000}
    </style> 
    <script>
        let count = 0;
        function Count_Items() {
            count++;
            if (count === 1) {
                document.getElementById("displayCount").innerText = count + " Item inspected";
            } else {
                document.getElementById("displayCount").innerText = count + " Items inspected";
            }
        }
    </script>
</head>
<body>
    <div style="text-align:center">
        <h1>Tawara Information Solutions (UK)<br>(Trial) Item counter <br></h1>
        <h3>Please click for each item inspected </h3><br><br><br>
        
        <button onClick="Count_Items()">Inspection Complete</button><br>
        
        <!-- FIXED: Combined the spaces into a single ID matching the JavaScript -->
        <h1 id="displayCount"></h1><br><br><br>
        
        <input type="button" value="Reset Counter" onClick="document.location.reload(true)">
    </div>
</body>
</html>
